services:
  postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - n8n
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n-main:
    image: n8nio/n8n:latest@sha256:14c4285bc3034dc5b51034aea393711d27053588e460722bce523453a626f23c
    env_file: .env
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      n8n:
        aliases:
          - n8n
      traefik-public:
      traefik-local:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)"
        - "traefik.http.routers.n8n.entrypoints=websecure"
        - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
        - "traefik.http.routers.n8n.priority=10"
        - "traefik.http.routers.n8n.middlewares=crowdsec@file,authentik-n8n-middleware@file,n8n-security-headers@file"
        - "traefik.http.routers.n8n-automation.rule=Host(`${N8N_HOST}`) && (Path(`/webhook`) || PathPrefix(`/webhook/`) || Path(`/webhook-test`) || PathPrefix(`/webhook-test/`) || Path(`/webhook-waiting`) || PathPrefix(`/webhook-waiting/`) || Path(`/mcp`) || PathPrefix(`/mcp/`) || Path(`/mcp-server`) || PathPrefix(`/mcp-server/`))"
        - "traefik.http.routers.n8n-automation.entrypoints=websecure"
        - "traefik.http.routers.n8n-automation.tls.certresolver=cloudflare"
        - "traefik.http.routers.n8n-automation.priority=100"
        - "traefik.http.routers.n8n-automation.middlewares=crowdsec@file,n8n-security-headers@file"
        - "traefik.http.routers.n8n-automation.service=n8n"
        - "traefik.http.services.n8n.loadbalancer.server.port=5678"
        - "traefik.docker.network=traefik-public"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  n8n-worker:
    image: n8nio/n8n:latest@sha256:14c4285bc3034dc5b51034aea393711d27053588e460722bce523453a626f23c
    command: worker
    env_file: .env
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n
      - traefik-local
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  n8n:
    external: true
  traefik-public:
    external: true
  traefik-local:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
